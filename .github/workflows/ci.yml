name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build the mod and compile its GameTests
        run: bash gradlew --no-daemon --max-workers=2 build compileGametestJava
      - name: Report resolved runtime dependencies
        run: bash gradlew --no-daemon --max-workers=2 dependencies --configuration runtimeClasspath
