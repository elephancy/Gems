plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = rootProject.mod_version
group = rootProject.maven_group

def osName = System.getProperty("os.name", "").toLowerCase(java.util.Locale.ROOT)
def buildVariant = osName.contains("windows") ? "win" : "wsl"
def buildOutputSuffix = (project.findProperty("buildOutputSuffix") ?: "").toString()
if (buildOutputSuffix && !(buildOutputSuffix ==~ /[a-z0-9][a-z0-9-]{0,31}/)) {
    throw new GradleException("buildOutputSuffix must be lowercase letters, digits or hyphens (max 32)")
}
buildDir = file("build-${buildVariant}${buildOutputSuffix ? '-' + buildOutputSuffix : ''}")

base {
    archivesName = "gems"
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

def LOG4J_VERSION = "2.25.3"
def LZ4_VERSION = "1.10.1"
def COMMONS_LANG3_VERSION = "3.18.0"

configurations.configureEach {
    resolutionStrategy {
        force "org.apache.logging.log4j:log4j-core:${LOG4J_VERSION}",
              "org.apache.logging.log4j:log4j-api:${LOG4J_VERSION}",
              "at.yawk.lz4:lz4-java:${LZ4_VERSION}",
              "org.apache.commons:commons-lang3:${COMMONS_LANG3_VERSION}"
        dependencySubstitution {
            substitute module("org.lz4:lz4-java") using module("at.yawk.lz4:lz4-java:${LZ4_VERSION}")
        }
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "gems" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "gems-standalone-gametest"
        // The standalone smoke is an explicit release gate, not part of every build.
        enableGameTests = false
        enableClientGameTests = false
        eula = true
    }
}

sourceSets.gametest.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.gametest.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
sourceSets.gametest.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.gametest.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath

loom {
    runs {
        standaloneGemsGameTest {
            inherit server
            name "Standalone Gems GameTest Server"
            runDir "run/standalone-gems-gametest"
            source sourceSets.main
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest=1"
            vmArg "-Dfabric-api.gametest.command=false"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/reports/standalone-gems-gametest.xml"
            programArg "nogui"
        }
        standaloneGemsClientGameTest {
            inherit client
            name "Standalone Gems Client GameTest"
            runDir "run/standalone-gems-client-gametest-${java.util.UUID.randomUUID()}"
            source sourceSets.main
            source sourceSets.client
            source sourceSets.gametest
            vmArg "-Dfabric.client.gametest"
        }
    }
}

tasks.register("standaloneGemsServerSmoke") {
    group = "verification"
    description = "Runs the opt-in Gems-only dedicated server GameTest."
    dependsOn("runStandaloneGemsGameTest")
}

def standaloneGemsServerRunPath = file("run/standalone-gems-gametest").absolutePath
def standaloneGemsArgFilesPath = file("${buildDir}/loom-cache/argFiles").absolutePath

tasks.register("prepareStandaloneGemsServerRunDir") {
    doNotTrackState("The dedicated test server run directory contains mutable world files.")
    doLast {
        def directory = new File(standaloneGemsServerRunPath)
        directory.mkdirs()
        new File(directory, "eula.txt").text = "eula=true\n"
        def propertiesFile = new File(directory, "server.properties")
        if (!propertiesFile.exists()) {
            propertiesFile.text = "online-mode=false\n"
        }
    }
}

tasks.named("runStandaloneGemsGameTest").configure {
    dependsOn("prepareStandaloneGemsServerRunDir")
    doFirst {
        new File(standaloneGemsArgFilesPath).mkdirs()
    }
}

tasks.register("standaloneGemsClientSmoke") {
    group = "verification"
    description = "Runs the opt-in Gems-only client UI GameTest."
    dependsOn("runStandaloneGemsClientGameTest")
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    clientImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    clientCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

processResources {
    doNotTrackState("Avoid incremental state tracking issues on mounted filesystems.")
    def modVersion = project.version
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }

    def sourceRootPath = file("src/main/resources").absolutePath
    def outputRootPath = destinationDir.absolutePath
    doLast {
        // Copy does not remove retired resources from an existing output
        // directory. Keep the standalone jar's content tied to this source set.
        def sourceRoot = java.nio.file.Path.of(sourceRootPath)
        def outputRoot = java.nio.file.Path.of(outputRootPath)
        def sourcePaths = [] as Set
        def outputPaths = [] as Set
        java.nio.file.Files.walk(sourceRoot).withCloseable { paths ->
            paths.forEach { path ->
                if (java.nio.file.Files.isRegularFile(path)) {
                    sourcePaths.add(sourceRoot.relativize(path).toString().replace('\\', '/'))
                }
            }
        }
        java.nio.file.Files.walk(outputRoot).withCloseable { paths ->
            paths.forEach { path ->
                if (java.nio.file.Files.isRegularFile(path)) {
                    outputPaths.add(outputRoot.relativize(path).toString().replace('\\', '/'))
                }
            }
        }
        if (sourcePaths != outputPaths) {
            throw new GradleException("Processed Gems resources differ from source; "
                    + "extra=${(outputPaths - sourcePaths).sort()}, "
                    + "missing=${(sourcePaths - outputPaths).sort()}. "
                    + "Run clean before packaging a release jar.")
        }
    }
}

jar {
    def licenseFile = rootProject.file("LICENSE")
    if (licenseFile.exists()) {
        from(licenseFile) {
            rename { "${it}_gems" }
        }
    }
}
